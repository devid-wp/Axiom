[package]
name = "axiom"
version = "0.1.0"
edition = "2021"
description = "AXIOM — Learn architecture, then create. Native desktop app (Slint)."
authors = ["AXIOM"]
repository = ""

[dependencies]
slint = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[build-dependencies]
slint-build = "1.10"
